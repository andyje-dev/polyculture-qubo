[project]
name = "polyculture-qubo"
version = "0.1.0"
description = "Quantum-computational framework for optimizing polyculture species selection in regenerative agriculture"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "networkx",
    "matplotlib",
    "seaborn",
    "requests",
    "openpyxl",
    "kaggle",
]

[dependency-groups]
dev = ["lefthook", "pytest", "ruff", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyculture_qubo"]

[tool.ruff]
fix = true

[tool.pytest.ini_options]
testpaths = ["tests"]