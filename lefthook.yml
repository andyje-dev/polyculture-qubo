pre-commit:
  commands:
    format:
      glob: "*.py"
      run: ruff format {staged_files} && git add {staged_files}
    lint:
      glob: "*.py"
      run: ruff check --fix {staged_files} && git add {staged_files}
    typecheck:
      glob: "*.py"
      run: ty check {staged_files}

pre-push:
  commands:
    secrets:
      run: gitleaks detect --source . --log-opts "$(git rev-parse @{upstream} 2>/dev/null || echo HEAD~1)..HEAD"
    tests:
      run: python -m pytest tests/ -x -q
