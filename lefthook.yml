# Dev tools (ruff, ty, pytest) are project dependencies installed into .venv by
# `uv sync`. Hooks run in a bare shell without the venv on PATH, so every command
# goes through `uv run`.

pre-commit:
  commands:
    format:
      glob: "*.py"
      run: uv run ruff format {staged_files} && git add {staged_files}
    lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files} && git add {staged_files}
    typecheck:
      glob: "*.py"
      run: uv run ty check {staged_files}

pre-push:
  commands:
    secrets:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "gitleaks not found. Install it with: brew install gitleaks"
          exit 1
        fi
        # Scan only what this push adds. Falls back to origin/main for a branch
        # with no upstream yet, and to a full-history scan for a fresh repo.
        base="$(git rev-parse --verify --quiet '@{upstream}' 2>/dev/null || git rev-parse --verify --quiet origin/main 2>/dev/null)"
        if [ -n "$base" ]; then
          gitleaks detect --source . --log-opts "$base..HEAD"
        else
          gitleaks detect --source .
        fi
    tests:
      run: uv run pytest tests/ -x -q
